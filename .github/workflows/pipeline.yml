name: pipeline

on:
  # schedule: twice an hour, :17 and :47 (UTC). GitHub runs scheduled workflows best-effort and drops many
  # under load: the median gap between runs was about 3 h in the first weeks (the manifest's `cadence`
  # reports it). The second line raises the odds of a reading in a given hour; it does not guarantee one.
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      fixtures:
        description: "Use the fixtures instead of the network (testing)"
        type: boolean
        default: false
      fail_ingest:
        description: "Force ingest to fail (tests the failure path)"
        type: boolean
        default: false

concurrency: pipeline

# Nothing by default; each job asks for what it uses.
permissions: {}

env:
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# Actions are pinned to the commit their version tag pointed at on 2026-11-14.
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the run to the data branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: data
          path: datastore
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest
        run: |
          start=$(date +%s); echo "START=$start" >> "$GITHUB_ENV"
          if [ "${{ inputs.fail_ingest }}" = "true" ]; then echo "forced failure"; exit 1; fi
          before=$(du -sb datastore --exclude=.git | cut -f1)
          python -m ingest --run-id "$RUN_ID" ${{ inputs.fixtures && '--fixtures' || '' }}
          # The CBSA history, about once a day by the time since the last check. It reports a failed
          # check and carries on: the feeds above are already collected.
          python -m ingest.history
          echo "SNAPSHOT_BYTES=$(( $(du -sb datastore --exclude=.git | cut -f1) - before ))" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: raw-${{ env.RUN_ID }}
          path: raw-artifact
          retention-days: 14

      # The readings are stored before anything downstream can fail. If dbt or the export breaks, this run's
      # snapshots are already on the data branch and published/ still holds the last good export.
      - name: Store the run's snapshots
        run: scripts/commit-data.sh ingest snapshots raw history

      - name: dbt build
        working-directory: dbt
        run: |
          dbt build --profiles-dir . --vars "{run_id: $RUN_ID, datastore: ../datastore}" --exclude tag:freshness

      - name: Freshness (never blocks)
        working-directory: dbt
        continue-on-error: true
        run: |
          dbt test --profiles-dir . --vars "{run_id: $RUN_ID, datastore: ../datastore}" --select tag:freshness --target-path target-freshness

      - name: Export and docs
        run: |
          python -m export --run-id "$RUN_ID" --run-url "$RUN_URL" --git-sha "$GITHUB_SHA" \
            --data-sha "$(git -C datastore rev-parse HEAD)" --run-seconds "$(( $(date +%s) - START ))" \
            --snapshot-bytes "$SNAPSHOT_BYTES"
          (cd dbt && dbt docs generate --static --profiles-dir . --vars "{datastore: ../datastore}")
          mkdir -p public/docs && cp dbt/target/static_index.html public/docs/index.html

      - name: Store the published export
        run: |
          rm -rf datastore/published && mkdir -p datastore/published && cp -r public/data datastore/published/
          scripts/commit-data.sh publish published

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Housekeeping after a good deploy. Nothing depends on it: if closing the issue fails, the data that was
  # just published is not reported as a failed run.
  recovered:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo ${{ github.repository }} --state open --label pipeline-failing --json number --jq '.[].number'); do
            gh issue close "$n" --repo ${{ github.repository }} --comment "Recovered in $RUN_URL"
          done

  on-failure:
    needs: [run, deploy]
    if: ${{ always() && (needs.run.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # reads which step failed
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: data
          path: datastore
          fetch-depth: 1

      # Pages replaces the whole site on a deploy, so the recovery site carries the last good data
      # (published/ on the data branch) AND the dbt docs, which are fetched from the site that is live now.
      # With neither (no run has succeeded yet), export.recover publishes a status.json that says so.
      - name: Last good site with an honest status.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.run_id }} --repo ${{ github.repository }} --json jobs > jobs.json
          step=$(jq -r '[.jobs[] | select(.name == "run" or .name == "deploy") | (.steps // [])[] | select(.conclusion == "failure") | .name][0] // "unknown"' jobs.json)
          if [ "${{ needs.deploy.result }}" = "failure" ]; then step=deploy; fi
          # were this run's readings stored before it failed?
          collected=$(jq -r '[.jobs[] | select(.name == "run") | (.steps // [])[] | select(.name == "Store the run'"'"'s snapshots" and .conclusion == "success")] | length > 0' jobs.json)
          curl -fsSL --max-time 60 -o last-good-docs.html \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/docs/" || rm -f last-good-docs.html
          python3 -m export.recover --published datastore/published --out public --run-id "$RUN_ID" \
            --failed-step "$step" --collected "$collected" --run-url "$RUN_URL" --docs last-good-docs.html
          echo "STEP=$step" >> "$GITHUB_ENV"

      # Its own artifact name: when the deploy job is what failed, this run already holds a 'github-pages' artifact.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-recovery
          path: public

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-recovery

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-failing --repo ${{ github.repository }} --color d73a4a 2>/dev/null || true
          n=$(gh issue list --repo ${{ github.repository }} --state open --label pipeline-failing --json number --jq '.[0].number')
          msg="Run $RUN_ID failed at step: $STEP. $RUN_URL"
          if [ -n "$n" ]; then gh issue comment "$n" --repo ${{ github.repository }} --body "$msg";
          else gh issue create --repo ${{ github.repository }} --label pipeline-failing --title "pipeline failing" --body "$msg"; fi
