name: border_waits
version: "1.0.0"
profile: bwt
config-version: 2

vars:
  run_id: ""
  datastore: "../datastore"
  # The by-hour chart and the rebuild check use this many days. Four of each weekday, and enough for
  # an hourly source to reach the chart's day gates (export/__main__.py CHART).
  recent_days: 28

seeds:
  border_waits:
    dim_crossing:
      +column_types:
        cbp_port_number: varchar
        featured: boolean
    excluded_snapshots:
      +column_types:
        path: varchar
        reason: varchar

models:
  border_waits:
    +materialized: table
